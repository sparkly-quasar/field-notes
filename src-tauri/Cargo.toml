[package]
name = "field_notes"
version = "0.29.1"
description = "Offline harm-reduction journal & trip-sitting workstation"
authors = ["sparkly-quasar"]
# Licensed under the PolyForm Noncommercial License 1.0.0 — see ../LICENSE.
license-file = "../LICENSE"
publish = false
edition = "2021"

[workspace]
members = [".", "core", "wasm"]
# `cargo test` covers the shared core too; the wasm crate is built by
# scripts/build-wasm.mjs for its own target.
default-members = [".", "core"]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows).
name = "field_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `test` gives us a real Tauri app with a mock runtime, so portal.rs can be driven
# over an actual socket — the portal's surface is HTTP, so that's where it's tested.
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The reference, checker and corpus search, shared with the phone (core/, wasm/).
field_notes_core = { path = "core" }
# SQLCipher (vendored, with vendored OpenSSL) so the journal can be encrypted at
# rest with a passphrase. Without a key set it reads/writes plaintext DBs, so
# existing unencrypted journals keep working (encryption is opt-in).
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# HTTP client for the localhost Ollama API (http only; the dose reference is now
# a bundled offline file, so no outbound/TLS request remains).
ureq = { version = "2", features = ["json"] }
tauri-plugin-dialog = "2"
# The optional, off-by-default phone portal (portal.rs). Bound to 127.0.0.1 only and
# fronted by `tailscale serve` — see the module docs before touching any of this.
tiny_http = "0.12"
# QR pairing: the token is scanned, never typed. `qrcode` renders to SVG offline.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# OS randomness for the portal's bearer token.
getrandom = "0.2"
# A person's journal backup travels to their phone as base64 in the portal's JSON.
base64 = "0.22"
# Per-device portal tokens are stored hashed (devices.rs), never in the clear.
sha2 = "0.10"
# Opt-in: remember the journal passphrase in the OS keychain, so a computer acting
# as the server can unlock itself after a reboot (keychain.rs).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Opt-in: open at login, for a computer acting as the server.
tauri-plugin-autostart = "2"
# Text import owns its timestamp rules (`normalize_import` in commands.rs): parse what
# the model extracted, drop what doesn't parse, rebase a T+ report onto its start.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# The phone downloads this once per version: keep it small.
[profile.release.package.field_notes_wasm]
opt-level = "s"
strip = true
codegen-units = 1
