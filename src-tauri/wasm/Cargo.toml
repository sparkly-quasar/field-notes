[package]
name = "field_notes_wasm"
version = "0.1.0"
description = "The shared checker and reference, compiled for the phone's offline mode"
license-file = "../../LICENSE"
publish = false
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
field_notes_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
